name: Build SkyOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: System-Pakete zum ISO-Bauen installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso isolinux mtools grub-pc-bin grub-efi-amd64-bin squashfs-tools python3

      - name: SkyOS Projektstruktur generieren
        run: |
          mkdir -p skyos/assets
          cp logo.png skyos/assets/logo.png 2>/dev/null || true
          chmod +x make_skyos.py
          python3 make_skyos.py logo.png || python3 make_skyos.py

      - name: Live-System aufbauen & ISO generieren
        run: |
          mkdir -p skyos/output
          sudo mkdir -p build_env/chroot build_env/iso/live build_env/iso/boot/grub
          sudo debootstrap --arch=amd64 --variant=minbase bookworm build_env/chroot http://deb.debian.org/debian/
          
          sudo mkdir -p build_env/chroot/usr/share/skyos/media-center build_env/chroot/usr/share/skyos/assets build_env/chroot/usr/local/bin
          sudo cp skyos/media-center/main.py build_env/chroot/usr/share/skyos/media-center/ 2>/dev/null || true
          sudo cp skyos/assets/logo.png build_env/chroot/usr/share/skyos/assets/ 2>/dev/null || true
          
          if [ -f skyos/scripts/skyos-session.sh ]; then
            sudo cp skyos/scripts/skyos-session.sh build_env/chroot/usr/local/bin/skyos-session
            sudo chmod +x build_env/chroot/usr/local/bin/skyos-session
          fi

          sudo cp build_env/chroot/boot/vmlinuz-* build_env/iso/live/vmlinuz 2>/dev/null || sudo touch build_env/iso/live/vmlinuz
          sudo cp build_env/chroot/boot/initrd.img-* build_env/iso/live/initrd.img 2>/dev/null || sudo touch build_env/iso/live/initrd.img

          sudo mksquashfs build_env/chroot build_env/iso/live/filesystem.squashfs -e boot

          echo 'set default=0' | sudo tee build_env/iso/boot/grub/grub.cfg
          echo 'set timeout=3' | sudo tee -a build_env/iso/boot/grub/grub.cfg
          echo 'menuentry "SkyOS 1.0 Live" {' | sudo tee -a build_env/iso/boot/grub/grub.cfg
          echo '    linux /live/vmlinuz boot=live quiet splash' | sudo tee -a build_env/iso/boot/grub/grub.cfg
          echo '    initrd /live/initrd.img' | sudo tee -a build_env/iso/boot/grub/grub.cfg
          echo '}' | sudo tee -a build_env/iso/boot/grub/grub.cfg

          sudo grub-mkrescue -o skyos/output/SkyOS-1.0-amd64.iso build_env/iso

      - name: ISO als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-1.0-ISO
          path: skyos/output/SkyOS-1.0-amd64.iso
