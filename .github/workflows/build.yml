name: Build SkyOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: System-Pakete zum ISO-Bauen installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso isolinux mtools grub-pc-bin grub-efi-amd64-bin squashfs-tools python3

      - name: SkyOS Projektstruktur generieren
        run: |
          mkdir -p skyos/assets
          cp logo.png skyos/assets/logo.png 2>/dev/null || true
          chmod +x make_skyos.py
          python3 make_skyos.py logo.png || python3 make_skyos.py

      - name: Live-System aufbauen & ISO generieren
        run: |
          mkdir -p skyos/output
          sudo mkdir -p build_env/chroot build_env/iso/live build_env/iso/boot/grub
          
          # 1. Minimales Debian-Grundsystem erstellen
          sudo debootstrap --arch=amd64 --variant=minbase bookworm build_env/chroot http://deb.debian.org/debian/
          
          # Non-free und Contrib Quellen hinzufügen (für beste Treiber-Unterstützung)
          echo "deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware" | sudo tee build_env/chroot/etc/apt/sources.list
          
          # 2. Treiber, Hardware-Beschleunigung, Codecs & Video-Engine im Hintergrund installieren
          sudo chroot build_env/chroot apt-get update
          sudo chroot build_env/chroot apt-get install -y --no-install-recommends \
            linux-image-amd64 \
            live-boot \
            systemd-sysv \
            xserver-xorg-core \
            xserver-xorg-video-all \
            xinit \
            mesa-va-drivers \
            va-driver-all \
            vdpau-driver-all \
            libva-drm2 \
            libva-x11-2 \
            i965-va-driver \
            intel-media-va-driver \
            firmware-linux-free \
            alsa-utils \
            pulseaudio \
            pipewire \
            network-manager \
            python3-pip \
            python3-pyside6 \
            chromium \
            chromium-l10n \
            mpv \
            ffmpeg \
            libavcodec-extra

          # 3. SkyOS Dateien in das System kopieren
          sudo mkdir -p build_env/chroot/usr/share/skyos/media-center \
                        build_env/chroot/usr/share/skyos/assets \
                        build_env/chroot/usr/local/bin

          sudo cp skyos/media-center/main.py build_env/chroot/usr/share/skyos/media-center/ 2>/dev/null || true
          sudo cp skyos/assets/logo.png build_env/chroot/usr/share/skyos/assets/ 2>/dev/null || true

          # 4. MPV-Konfiguration für flüssige 1080p/4K Hardware-Wiedergabe erstellen
          sudo mkdir -p build_env/chroot/etc/mpv
          cat << 'EOF' | sudo tee build_env/chroot/etc/mpv/mpv.conf
hwdec=auto-safe
vo=gpu
profile=fast
keep-open=no
border=no
ontop=yes
EOF

          # 5. Autostart-Skript erstellen (Kiosk-Modus)
          cat << 'EOF' | sudo tee build_env/chroot/usr/local/bin/start-skyos.sh
#!/bin/sh
export DISPLAY=:0
export SKYOS_ROOT="/usr/share/skyos"
xset s off
xset -dpms
xset s noblank
exec python3 /usr/share/skyos/media-center/main.py
EOF
          sudo chmod +x build_env/chroot/usr/local/bin/start-skyos.sh

          # 6. Systemd Autologin einrichten
          sudo mkdir -p build_env/chroot/etc/systemd/system/getty@tty1.service.d/
          cat << 'EOF' | sudo tee build_env/chroot/etc/systemd/system/getty@tty1.service.d/override.conf
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
EOF

          # Startskript beim Booten automatisch ausführen
          cat << 'EOF' | sudo tee -a build_env/chroot/root/.bashrc
if [ -z "$DISPLAY" ] && [ "$(tty)" = "/dev/tty1" ]; then
    startx /usr/local/bin/start-skyos.sh -- -nocursor
fi
EOF

          # 7. Kernel und Initrd sichern
          sudo cp build_env/chroot/boot/vmlinuz-* build_env/iso/live/vmlinuz 2>/dev/null || true
          sudo cp build_env/chroot/boot/initrd.img-* build_env/iso/live/initrd.img 2>/dev/null || true

          # 8. SquashFS Dateisystem erstellen
          sudo mksquashfs build_env/chroot build_env/iso/live/filesystem.squashfs -e boot

          # 9. GRUB Bootloader Konfiguration
          cat << 'EOF' | sudo tee build_env/iso/boot/grub/grub.cfg
set default=0
set timeout=2

menuentry "SkyOS 1.0" {
    linux /live/vmlinuz boot=live quiet splash
    initrd /live/initrd.img
}
EOF

          # 10. ISO-Datei generieren
          sudo grub-mkrescue -o skyos/output/SkyOS-1.0-amd64.iso build_env/iso

      - name: ISO als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-1.0-ISO
          path: skyos/output/SkyOS-1.0-amd64.iso
