name: Build SkyOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: System-Pakete zum ISO-Bauen installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso isolinux mtools grub-pc-bin grub-efi-amd64-bin squashfs-tools python3

      - name: SkyOS Projektstruktur generieren
        run: |
          mkdir -p skyos/assets skyos/media-center skyos/output
          cp logo.png skyos/assets/logo.png 2>/dev/null || true
          chmod +x make_skyos.py 2>/dev/null || true
          python3 make_skyos.py 2>/dev/null || true

          # Notfall-Fallback: Kiosk-Media-Center erstellen, falls main.py fehlt
          if [ ! -f skyos/media-center/main.py ]; then
            cat << 'EOF' > skyos/media-center/main.py
import sys
from PySide6.QtWidgets import QApplication, QMainWindow, QLabel, QVBoxLayout, QWidget
from PySide6.QtCore import Qt

class SkyOSMediaCenter(QMainWindow):
    def __init__(self):
        super().__init__()
        self.setWindowTitle("SkyOS 1.0")
        self.showFullScreen()
        
        central_widget = QWidget(self)
        self.setCentralWidget(central_widget)
        central_widget.setStyleSheet("background-color: #0b0f19;")
        
        layout = QVBoxLayout(central_widget)
        layout.setAlignment(Qt.AlignCenter)
        
        label = QLabel("SkyOS 1.0 Media Center", self)
        label.setStyleSheet("color: #00d2ff; font-size: 48px; font-weight: bold;")
        label.setAlignment(Qt.AlignCenter)
        
        layout.addWidget(label)

if __name__ == "__main__":
    app = QApplication(sys.argv)
    window = SkyOSMediaCenter()
    window.show()
    sys.exit(app.exec())
EOF
          fi

      - name: Live-System aufbauen & ISO generieren
        run: |
          sudo mkdir -p build_env/chroot build_env/iso/live build_env/iso/boot/grub
          
          # 1. Minimales Debian-Grundsystem
          sudo debootstrap --arch=amd64 --variant=minbase bookworm build_env/chroot http://deb.debian.org/debian/
          
          # DNS und Paketquellen setzen
          sudo cp /etc/resolv.conf build_env/chroot/etc/resolv.conf
          printf "deb http://deb.debian.org/debian/ bookworm main contrib non-free non-free-firmware\n" | sudo tee build_env/chroot/etc/apt/sources.list

          # Virtuelle Systempfade einbinden (Verhindert Exit-Code 100 bei der Kernel-Installation)
          sudo mount -t proc /proc build_env/chroot/proc
          sudo mount -t sysfs /sys build_env/chroot/sys
          sudo mount --bind /dev build_env/chroot/dev
          sudo mount --bind /dev/pts build_env/chroot/dev/pts

          # 2. Kernel, X11, Grafik-Hardwarebeschleunigung, Python & Player installieren
          sudo chroot build_env/chroot env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo chroot build_env/chroot env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            linux-image-amd64 \
            live-boot \
            systemd-sysv \
            xserver-xorg \
            xinit \
            x11-xserver-utils \
            python3-pip \
            python3-pyside6 \
            mpv \
            ffmpeg \
            chromium \
            alsa-utils \
            pulseaudio \
            mesa-va-drivers

          # Systempfade nach Installation wieder trennen
          sudo umount -l build_env/chroot/dev/pts || true
          sudo umount -l build_env/chroot/dev || true
          sudo umount -l build_env/chroot/proc || true
          sudo umount -l build_env/chroot/sys || true

          # 3. SkyOS Dateien in Chroot kopieren
          sudo mkdir -p build_env/chroot/usr/share/skyos/media-center \
                        build_env/chroot/usr/share/skyos/assets \
                        build_env/chroot/usr/local/bin

          sudo cp -r skyos/media-center/* build_env/chroot/usr/share/skyos/media-center/ 2>/dev/null || true
          sudo cp skyos/assets/logo.png build_env/chroot/usr/share/skyos/assets/ 2>/dev/null || true

          # 4. MPV-Konfiguration für Hardware-Beschleunigung (1080p)
          sudo mkdir -p build_env/chroot/etc/mpv
          printf "hwdec=auto-safe\nvo=gpu\nprofile=fast\nkeep-open=no\nborder=no\nontop=yes\n" | sudo tee build_env/chroot/etc/mpv/mpv.conf

          # 5. Autostart-Skript erstellen (Kiosk-Modus)
          printf "#!/bin/sh\nexport DISPLAY=:0\nexport SKYOS_ROOT=\"/usr/share/skyos\"\nxset s off\nxset -dpms\nxset s noblank\nexec python3 /usr/share/skyos/media-center/main.py\n" | sudo tee build_env/chroot/usr/local/bin/start-skyos.sh
          sudo chmod +x build_env/chroot/usr/local/bin/start-skyos.sh

          # 6. Systemd Autologin auf tty1
          sudo mkdir -p build_env/chroot/etc/systemd/system/getty@tty1.service.d/
          printf "[Service]\nExecStart=\nExecStart=-/sbin/agetty --autologin root --noclear %%I \$TERM\n" | sudo tee build_env/chroot/etc/systemd/system/getty@tty1.service.d/override.conf

          # Startskript beim Booten ausführen
          printf "\nif [ -z \"\$DISPLAY\" ] && [ \"\$(tty)\" = \"/dev/tty1\" ]; then\n    startx /usr/local/bin/start-skyos.sh -- -nocursor\nfi\n" | sudo tee -a build_env/chroot/root/.bashrc

          # 7. Kernel und Initrd sichern
          sudo cp build_env/chroot/boot/vmlinuz-* build_env/iso/live/vmlinuz
          sudo cp build_env/chroot/boot/initrd.img-* build_env/iso/live/initrd.img

          # 8. SquashFS Dateisystem komprimieren
          sudo mksquashfs build_env/chroot build_env/iso/live/filesystem.squashfs -e boot dev proc sys

          # 9. GRUB Bootloader Konfiguration
          printf "set default=0\nset timeout=2\n\nmenuentry \"SkyOS 1.0\" {\n    linux /live/vmlinuz boot=live quiet splash\n    initrd /live/initrd.img\n}\n" | sudo tee build_env/iso/boot/grub/grub.cfg

          # 10. ISO-Datei generieren
          sudo grub-mkrescue -o skyos/output/SkyOS-1.0-amd64.iso build_env/iso

      - name: ISO als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: SkyOS-1.0-ISO
          path: skyos/output/SkyOS-1.0-amd64.iso
